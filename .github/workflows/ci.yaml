name: CI Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
  push:
    branches:
      - '!main'

permissions: {}

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Cache TFLint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (Root)
        run: terraform init -backend=false

      - name: Terraform Validate (Root)
        run: terraform validate

      - name: Terraform Init and Validate (Modules)
        run: |
          for module in modules/*/; do
            echo "Validating ${module}..."
            cd "${module}"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          done

      - name: TFLint
        run: |
          tflint --init
          tflint
          for module in modules/*/; do
            echo "Linting ${module}..."
            tflint --chdir="${module}"
          done


  python:
    name: Python Testing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        module:
          - modules/eventbus
          - modules/mock-ticket-update
          - modules/prepare-text
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles(format('{0}/**/uv.lock', matrix.module)) }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        run: uv sync --dev

      - name: Ruff Lint
        working-directory: ${{ matrix.module }}
        run: uv run ruff check .

      - name: Ruff Format Check
        working-directory: ${{ matrix.module }}
        run: uv run ruff format --check .

      - name: Type Check with ty
        working-directory: ${{ matrix.module }}
        run: uv run ty check

      - name: Run Tests with Coverage
        working-directory: ${{ matrix.module }}
        run: |
          uv run coverage run -m pytest handler/
          uv run coverage report
